# Nginx Yapılandırması - HTTP ONLY (SSL YOK)
# Bu dosyayı /etc/nginx/sites-available/iot-analytics olarak kaydedin
# Domain: devrekbenimmarketim.com için hazırlanmıştır
# SSL sertifikası OLMADAN çalışır

server {
    listen 80;
    server_name iot.devrekbenimmarketim.com;  # IoT subdomain

    # Log dosyaları
    access_log /var/log/nginx/iot-analytics-access.log;
    error_log /var/log/nginx/iot-analytics-error.log;

    # Maksimum upload boyutu
    client_max_body_size 1M;

    location / {
        proxy_pass http://localhost:3001;  # IoT projesinin portu (3001 olmalı, 3000 değil!)
        
        proxy_http_version 1.1;
        
        # WebSocket desteği
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
    }

    # Static dosyalar için cache (opsiyonel)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        proxy_pass http://localhost:3001;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ÖNEMLİ NOTLAR:
# 1. Port 3001 kullanın (MERN projeniz 3000'de çalışıyor)
# 2. SSL sertifikası yok, sadece HTTP (port 80)
# 3. ESP8266 kodunda port 80 kullanın
# 4. Ana domain'in yapılandırmasında server_name'in sadece devrekbenimmarketim.com olduğundan emin olun

